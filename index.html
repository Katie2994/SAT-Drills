      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#dc2323',
                yellow: '#ffe36d',
                black: '#000000',
                dark: '#1e1e1e',

              },
              surface: {
                muted: '#ffffff',
                base: '#000000',
                strong: '#f5f7fc'
              },
              border: {
                muted: '#324dc7',
                strong: '#d9d9d9'
              }
            },
            fontFamily: {
              mono: ['Roboto Mono', 'monospace'],
              sans: ['Roboto', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              math: ['"Cambria Math"', 'Cambria', '"Times New Roman"', 'serif']
            },
            fontSize: {
              xs: ['14px', '24px'],
              sm: ['16px', '24px'],
              md: ['18px', '28px'],
              lg: ['21px', '32px'],
              xl: ['24px', '36px'],
              '2xl': ['26px', '40px'],
              '3xl': ['28px', '44px'],
              '4xl': ['40px', '56px']
            },
            spacing: {
              'cb-1': '8px',
              'cb-2': '11px',
              'cb-3': '12px',
              'cb-4': '16px',
              'cb-5': '17px',
              'cb-6': '20px',
              'cb-7': '23px',
              'cb-8': '24px'
            },
            borderRadius: {
              'cb-xs': '12px',
              'cb-sm': '16px',
              'cb-md': '24px',
              'cb-lg': '32px'
            },
            boxShadow: {
              'cb': '0px 0px 12px 0px rgba(0, 0, 0, 0.1)',
              'hard': '4px 4px 0px 0px rgba(0,0,0,1)',
              'hard-sm': '2px 2px 0px 0px rgba(0,0,0,1)'
            },
            transitionDuration: {
              'instant': '200ms',
              'fast': '250ms'
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyFAMyFwwPWvnO81g490W62d+tv58b7u0f3EcvT0DI1SUh6v5tJ1X9SO3XOX3" crossorigin="anonymous"></script>

    <!-- Desmos API removed from here for security obfuscation -->

    <style>
      body { 
        font-family: 'Roboto', sans-serif; 
        background-color: #f5f7fc; 
        color: #1e1e1e;
        font-size: 16px;
        font-weight: 400;
        line-height: 24px;
      }
      
      /* Global Focus Visible */
      *:focus-visible {
        outline: 2px solid #dc2323;
        outline-offset: 2px;
      }
      .flip-card { perspective: 1000px; }
      .flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
      .flip-card-front, .flip-card-back { backface-visibility: hidden; }
      .flip-card-back { transform: rotateY(180deg); }
      .flipped { transform: rotateY(180deg); }
      
      /* Hard shadow utility */
      .shadow-hard { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
      .shadow-hard-sm { box-shadow: 2px 2px 0px 0px rgba(0,0,0,1); }
      
      .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      
      /* Base overrides */
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* KaTeX overrides for better fit */
      .katex { font-size: 1.1em; }

      /* Markdown Custom Styles */
      .markdown-style-custom p, .markdown-style-custom-export p { margin-bottom: 1em; }
      .markdown-style-custom strong, .markdown-style-custom-export strong { font-weight: 800; color: #dc2323; }
      .markdown-style-custom em, .markdown-style-custom-export em { font-style: italic; font-weight: 600; text-decoration: underline; text-decoration-color: #ffe36d; text-decoration-thickness: 3px; }
      .markdown-style-custom ul, .markdown-style-custom-export ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-style-custom ol, .markdown-style-custom-export ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-style-custom li, .markdown-style-custom-export li { margin-bottom: 0.5em; }
      .markdown-style-custom h1, .markdown-style-custom-export h1,
      .markdown-style-custom h2, .markdown-style-custom-export h2,
      .markdown-style-custom h3, .markdown-style-custom-export h3 { font-weight: 900; margin-top: 1.5em; margin-bottom: 0.5em; color: #000; text-transform: uppercase; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4a5568; border-radius: 10px; }

      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
